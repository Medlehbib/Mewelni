/* ====== MOTEUR ====== */
const $=s=>document.querySelector(s);
const ROUTES=["home","owner","funder","about","team","contact","privacy","terms"];
const NAV=["home","owner","funder","about","team","contact"];
let lang=localStorage.getItem("mw_lang");if(!D[lang])lang="ar";
const route=()=>{const r=location.hash.replace(/^#\/?/,"");return ROUTES.includes(r)?r:"home"};
const a=(r,txt,cls="btn bp")=>`<a class="${cls}" href="#/${r}">${txt}</a>`;
const ul=l=>`<ul>${l.map(x=>`<li>${x}</li>`).join("")}</ul>`;
const user=(t,p,r)=>`<article class="card"><h3>${t}</h3><p>${p}</p></article>`;
const avatar=`<div class="av" aria-hidden="true"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#13B981" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div>`;
const teamCards=()=>`<div class="g">${TEAM.map(m=>`<article class="card tm">${avatar}<h3>${m[0]}</h3><p class="la" lang="en">${m[1]}</p></article>`).join("")}</div>`;
const head=(t,l)=>`<div class="sh"><h2>${t}</h2>${l?`<p class="lead">${l}</p>`:""}</div>`;
const contactBox=T=>CONFIG.CONTACT.length?`<div class="g">${CONFIG.CONTACT.map(c=>`<article class="card"><h3>${c.label}</h3><p><a href="${c.href}">${c.text}</a></p></article>`).join("")}</div>`:`<div class="empty">${T.contact[2]}</div>`;

function home(T){
  const[h,p,b]=T.hero,s=T.ps,hw=T.how,c=T.cats,e=T.ex,t=T.tr;
  return `<section class="hero"><div class="c"><span class="badge">${b}</span><h1>${h}</h1><p>${p}</p>
  <div class="acts">${a("owner",T.o)}${a("funder",T.f,"btn bo")}</div></div></section>
  <section><div class="c">${head(s[0])}<div class="g">
   <article class="card pr"><h3>${s[1]}</h3><p>${s[2]}</p>${ul(s[3])}</article>
   <article class="card so"><h3>${s[4]}</h3><p>${s[5]}</p>${ul(s[6])}</article></div></div></section>
  <section class="alt"><div class="c">${head(hw[0],hw[1])}<div class="g">${hw[2].map((x,i)=>`<article class="card"><div class="num">${i+1}</div><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join("")}</div></div></section>
  <section><div class="c">${head(c[0])}<div class="g">
   <article class="card"><h3>${c[1][0]}</h3><p>${c[1][1]}</p><div class="acts" style="margin-top:16px">${a("owner",T.more,"btn bd")}</div></article>
   <article class="card"><h3>${c[2][0]}</h3><p>${c[2][1]}</p><div class="acts" style="margin-top:16px">${a("funder",T.more,"btn bd")}</div></article></div></div></section>
  <section class="alt"><div class="c">${head(e[0])}<div class="g">${e[2].map(x=>`<article class="card"><span class="tag">${T.ill}</span><span class="cat">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join("")}</div><p class="note">${e[1]}</p></div></section>
  <section><div class="c">${head(t[0],t[1])}<div class="g">${t[2].map(x=>`<article class="card"><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join("")}</div></div></section>
  <section class="alt"><div class="c">${head(T.team)}${teamCards()}<div class="acts" style="justify-content:center;margin-top:28px">${a("team",T.n[4],"btn bd")}</div></div></section>
  <section><div class="c">${head(T.contact[0],T.contact[1])}${contactBox(T)}</div></section>`;
}
function page(T,k){
  const p=T.pg[k];
  const blocks=p.b.map(([h,c])=>`<h2>${h}</h2>`+(typeof c==="string"?`<p>${c}</p>`:Array.isArray(c)?ul(c):c.f.map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join(""))).join("");
  const other=k==="owner"?a("funder",T.toF,"btn bd"):k==="funder"?a("owner",T.toO,"btn bd"):"";
  return `<div class="ph"><div class="c"><h1>${p.t}</h1><p>${p.l}</p></div></div>
  <section><div class="c txt">${p.d?`<div class="draft">${p.d}</div>`:""}${blocks}
  <div class="after">${a("home",T.back)}${other}</div></div></section>`;
}
function simple(T,k){
  const body=k==="team"?teamCards():contactBox(T);
  const t=k==="team"?T.team:T.contact[0],l=k==="contact"?T.contact[1]:"";
  return `<div class="ph"><div class="c"><h1>${t}</h1>${l?`<p>${l}</p>`:""}</div></div><section><div class="c">${body}<div class="after">${a("home",T.back)}</div></div></section>`;
}
function render(){
  const T=D[lang],r=route();
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.title=T.title[r];
  $("#brand").textContent=T.brand;$("#skip").textContent=T.skip;
  $("#nav").innerHTML=`<ul class="links" id="navul">${NAV.map((k,i)=>`<li><a href="#/${k}"${k===r?' class="on" aria-current="page"':""}>${T.n[i]}</a></li>`).join("")}</ul>`;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  $("#main").innerHTML=r==="home"?home(T):r==="team"||r==="contact"?simple(T,r):page(T,r);
  $("#foot").innerHTML=`<div class="c"><div class="fg"><div><a href="#/home" class="logo"><span class="lm" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 64 64" fill="none" stroke="#13B981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 48V18l20 22 20-22v30"/></svg></span>${T.brand}</a><p>${T.foot}</p></div>
  <div><h3>${T.quick}</h3><ul>${NAV.map((k,i)=>`<li><a href="#/${k}">${T.n[i]}</a></li>`).join("")}</ul></div>
  <div><h3>${T.legal}</h3><ul><li><a href="#/privacy">${T.priv}</a></li><li><a href="#/terms">${T.terms}</a></li></ul></div></div><p class="cp">${T.rights}</p></div>`;
  $("#mt").setAttribute("aria-label",T.n[0]);
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.l;localStorage.setItem("mw_lang",lang);render()}));
$("#mt").addEventListener("click",()=>{const o=$("#navul").classList.toggle("open");$("#mt").setAttribute("aria-expanded",o)});
document.addEventListener("click",e=>{if(e.target.closest("#navul a")){$("#navul").classList.remove("open");$("#mt").setAttribute("aria-expanded","false")}});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0);$("#main").focus({preventScroll:true})});
try{lang=localStorage.getItem("mw_lang")||lang}catch(e){}
render();
</script>
